def seedDevEnvironment = tasks.register('seedDevEnvironment') {
    def optionsSource = layout.projectDirectory.file('dev/options.txt')
    def optionsTarget = layout.projectDirectory.file('run/options.txt')
    def modsDir = layout.projectDirectory.dir('run/mods')
    inputs.file(optionsSource)
    inputs.property('modUrls', runtimeModUrls)
    outputs.file(optionsTarget)
    outputs.dir(modsDir)
    doLast {
        def sourceFile = optionsSource.asFile
        def targetFile = optionsTarget.asFile
        targetFile.parentFile.mkdirs()
        if (!targetFile.exists()) {
            targetFile.bytes = sourceFile.bytes
        }

        def dir = modsDir.asFile
        dir.mkdirs()
        runtimeModUrls.each { String url ->
            def encodedName = url.substring(url.lastIndexOf('/') + 1)
            def name = java.net.URLDecoder.decode(encodedName, 'UTF-8')
            def dest = new File(dir, name)
            if (!dest.exists()) {
                logger.lifecycle("Downloading {}", name)
                dest.withOutputStream { out ->
                    def conn = java.net.URI.create(url).toURL().openConnection()
                    conn.setRequestProperty('User-Agent', 'mcpied-dev/1.0')
                    conn.inputStream.withStream { inp -> out << inp }
                }
            }
        }
    }
}

tasks.named('runClient').configure { task ->
    task.dependsOn seedDevEnvironment
    def lastWorld = objects.newInstance(LastPlayedWorldArgs)
    lastWorld.savesDir.convention(layout.projectDirectory.dir('run/saves'))
    lastWorld.worldOverride.convention(providers.gradleProperty('world').orElse('test'))
    task.argumentProviders.add(lastWorld)
}
tasks.named('runServer').configure { dependsOn seedDevEnvironment }

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            lightmans_currency_version: lightmans_currency_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    // Optional at runtime. Version IDs, not names: names on Modrinth Maven can resolve the Fabric jar.
    compileOnly "maven.modrinth:wvMc8AJt:${lightmans_currency_version_id}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

abstract class LastPlayedWorldArgs implements org.gradle.process.CommandLineArgumentProvider {
    @Internal
    abstract DirectoryProperty getSavesDir()

    @Optional
    @Input
    abstract Property<String> getWorldOverride()

    @Override
    Iterable<String> asArguments() {
        if (worldOverride.present) {
            def name = worldOverride.get().trim()
            if (name.isEmpty() || name.equalsIgnoreCase('none')) {
                return []
            }
            def worldDir = new File(savesDir.get().asFile, name)
            if (!worldDir.isDirectory() || !new File(worldDir, 'level.dat').exists()) {
                return []
            }
            return ['--quickPlaySingleplayer', name]
        }

        def dir = savesDir.get().asFile
        if (!dir.exists()) {
            return []
        }

        def last = dir.listFiles()?.findAll { File candidate ->
            candidate.directory && new File(candidate, 'level.dat').exists()
        }?.max { it.lastModified() }

        if (last == null) {
            return []
        }
        return ['--quickPlaySingleplayer', last.name]
    }
}
